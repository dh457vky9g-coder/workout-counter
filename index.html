<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workout">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Workout Counter</title>
<style>
:root{color-scheme:dark;--bg:#101522;--panel:#1a2333;--line:#2b374b;--muted:#9aa8bc;--accent:#6d8cff;--green:#36c98f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 16px calc(22px + env(safe-area-inset-bottom));}
main{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}.head{display:flex;justify-content:space-between;align-items:center;padding:10px 2px}.eyebrow{font-size:11px;letter-spacing:1.5px;color:var(--muted)}h1{font-size:23px;margin:4px 0 0}.status{font-size:12px;padding:8px 12px;border-radius:30px;background:#263455;color:#cbd7ff}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:19px;padding:17px}.field{display:flex;flex-direction:column;gap:8px;margin:4px 0}.field label{font-size:13px;color:#c6d0df;font-weight:600}input,select{width:100%;border:1px solid var(--line);background:#111a29;color:white;border-radius:11px;padding:13px;font-size:16px;outline:none}
.counter{text-align:center;display:flex;flex-direction:column;align-items:center;gap:13px}.caption{font-size:13px;color:var(--muted)}.number{font-size:76px;font-weight:800;line-height:1.1;letter-spacing:-3px;font-variant-numeric:tabular-nums}.timer{font-size:66px;font-weight:800;letter-spacing:-2px;font-variant-numeric:tabular-nums}
button{border:1px solid var(--line);background:#202c40;color:#f5f7fb;border-radius:13px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.985)}button:disabled{opacity:.38;cursor:not-allowed}.primary{background:var(--accent);border-color:var(--accent);color:white}.bigbtn{width:100%;font-size:19px;padding:19px}.row{display:flex;gap:9px;width:100%}.row>*{flex:1}.muted{font-size:12px;color:var(--muted);text-align:center;line-height:1.5}.bar{height:7px;background:#303b4e;border-radius:20px;overflow:hidden;width:100%}.fill{height:100%;background:var(--accent);width:0%;transition:width .2s}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.statlabel{font-size:12px;color:var(--muted)}.statnum{font-size:30px;font-weight:800;margin-top:5px}.spoken{font-size:18px;font-weight:700;min-height:27px;color:#dce4ff}.small{font-size:12px;color:var(--muted)}.toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:#c6d0df}.toggle input{width:18px;height:18px;accent-color:var(--accent)}
</style>
</head>
<body>
<main>
 <header class="head"><div><div class="eyebrow">WORKOUT TRACKER</div><h1>운동 카운터</h1></div><span id="status" class="status">운동 준비</span></header>
 <section class="panel">
  <div class="field"><label for="exercise">운동 종목</label><input id="exercise" value="스쿼트" maxlength="30" autocomplete="off"></div>
  <div class="field"><label for="duration">1회 운동 후 휴식 시간 (초)</label><input id="duration" type="number" min="1" max="3600" value="60" inputmode="numeric"></div>
  <label class="toggle"><input id="voiceOn" type="checkbox" checked> 한국어 음성 카운팅 및 휴식 카운트다운</label>
 </section>
 <section class="panel counter">
  <div class="caption">누적 운동 횟수</div><div id="count" class="number">0</div>
  <button id="plus" class="primary bigbtn">＋ 1회 운동 완료</button>
  <div class="muted">누르면 횟수를 읽고 자동으로 휴식이 시작됩니다.</div>
  <button id="minus" style="width:100%">− 1회 되돌리기</button>
 </section>
 <section class="panel counter">
  <div style="display:flex;justify-content:space-between;width:100%;align-items:center"><b>휴식 타이머</b><span id="restState" class="small">대기 중</span></div>
  <div id="timer" class="timer">01:00</div>
  <div class="bar"><div id="bar" class="fill"></div></div>
  <div id="spoken" class="spoken">준비되었습니다</div>
  <div class="row"><button id="pause" disabled>일시정지</button><button id="skip" disabled>휴식 건너뛰기</button></div>
  <div id="message" class="muted">마지막 5초를 음성으로 알려드립니다.</div>
 </section>
 <section class="stats">
  <div class="panel"><div class="statlabel">누적 운동 횟수</div><div id="total" class="statnum">0</div></div>
  <div class="panel"><div class="statlabel">운동 종목</div><div id="exerciseStat" class="statnum" style="font-size:20px;overflow-wrap:anywhere">스쿼트</div></div>
 </section>
 <div class="row"><button id="test">음성 테스트</button><button id="reset">전체 초기화</button></div>
 <p class="muted">음성은 아이폰의 한국어 시스템 음성을 사용합니다. 화면을 켜 둔 상태에서 사용하는 것을 권장합니다. iOS가 앱을 백그라운드로 전환하면 타이머 및 음성 실행이 제한될 수 있습니다.</p>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id);
let count=0,remaining=60,duration=60,interval=null,paused=false,lastSpoken=null,voices=[];
const fmt=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
function loadVoices(){voices=window.speechSynthesis?window.speechSynthesis.getVoices():[]}
if('speechSynthesis'in window){loadVoices();speechSynthesis.addEventListener?.('voiceschanged',loadVoices)}
function speak(text){
 if(!$('voiceOn').checked||!('speechSynthesis'in window))return;
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text);u.lang='ko-KR';u.rate=1;u.pitch=1;u.volume=1;
 const v=voices.find(x=>x.lang.toLowerCase()==='ko-kr')||voices.find(x=>x.lang.toLowerCase().startsWith('ko'));
 if(v)u.voice=v;speechSynthesis.speak(u);
}
function render(){
 $('count').textContent=count;$('total').textContent=count;
 $('exerciseStat').textContent=$('exercise').value.trim()||'운동';
 $('timer').textContent=fmt(remaining);$('bar').style.width=((duration-remaining)/duration*100)+'%';
 $('plus').disabled=interval!==null||paused;$('minus').disabled=count===0;
 $('pause').disabled=interval===null&&!paused;$('skip').disabled=interval===null&&!paused;
 $('pause').textContent=paused?'계속하기':'일시정지';
}
function stop(){if(interval!==null)clearInterval(interval);interval=null;paused=false}
function finish(){
 stop();remaining=0;$('status').textContent='휴식 완료';$('restState').textContent='완료';
 $('spoken').textContent='휴식 종료!';$('message').textContent='다음 운동을 시작하세요!';
 speak('휴식 종료! 다음 운동 시작하세요!');render();
}
function tick(){
 remaining=Math.max(0,remaining-1);
 if(remaining>=1&&remaining<=5&&remaining!==lastSpoken){
  lastSpoken=remaining;$('spoken').textContent=remaining+'초';speak(remaining+'초');
 }
 render();if(remaining===0)finish();
}
function start(){
 duration=Math.max(1,Math.min(3600,Number($('duration').value)||60));remaining=duration;paused=false;lastSpoken=null;
 $('status').textContent='휴식 중';$('restState').textContent='진행 중';$('spoken').textContent='휴식 중';
 $('message').textContent='마지막 5초 동안 매초 음성 안내가 나옵니다.';
 interval=setInterval(tick,1000);render();
}
$('plus').addEventListener('click',()=>{
 if(interval!==null||paused)return;
 count++;speak(count+'회');render();start();
});
$('minus').addEventListener('click',()=>{if(count>0&&interval===null&&!paused){count--;render()}});
$('pause').addEventListener('click',()=>{
 if(interval!==null){clearInterval(interval);interval=null;paused=true;if('speechSynthesis'in window)speechSynthesis.cancel();$('restState').textContent='일시정지';$('message').textContent='휴식 타이머가 일시정지되었습니다.'}
 else if(paused){paused=false;$('restState').textContent='진행 중';interval=setInterval(tick,1000)}
 render();
});
$('skip').addEventListener('click',()=>{
 if(interval!==null||paused){stop();if('speechSynthesis'in window)speechSynthesis.cancel();remaining=0;
 $('status').textContent='휴식 완료';$('restState').textContent='완료';$('spoken').textContent='휴식 건너뛰기';$('message').textContent='다음 운동을 시작하세요!';render()}
});
$('test').addEventListener('click',()=>speak('음성 테스트입니다. 운동 횟수 하나. 휴식 5초, 4초, 3초, 2초, 1초. 휴식 종료!'));
$('reset').addEventListener('click',()=>{
 stop();if('speechSynthesis'in window)speechSynthesis.cancel();count=0;
 duration=Math.max(1,Number($('duration').value)||60);remaining=duration;lastSpoken=null;
 $('status').textContent='운동 준비';$('restState').textContent='대기 중';$('spoken').textContent='준비되었습니다';
 $('message').textContent='마지막 5초를 음성으로 알려드립니다.';render();
});
$('duration').addEventListener('change',()=>{if(interval===null&&!paused){duration=Math.max(1,Math.min(3600,Number($('duration').value)||60));remaining=duration;render()}});
$('exercise').addEventListener('input',render);
if('serviceWorker'in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();
})();
</script>
</body></html>
